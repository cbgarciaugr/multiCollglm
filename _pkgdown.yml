url: https://cbgarciaugr.github.io/multiCollglm/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "multiCollglm: collinearity diagnostics for GLMs"

reference:
- title: Diagnostics
  desc: >
    The three main functions, computed on the design matrix weighted by
    IRLS at convergence and scaled to unit length by column (without
    centering).
  contents:
  - condition_number
  - bkw_diagnostics
  - rvif_diagnostics
- title: Example datasets
  desc: >
    Real data used in the reproduction articles (see below).
  contents:
  - Nitrogen
  - Mine
  - LeeCancer
  - Plastic
- title: Package
  contents:
  - multiCollglm-package

articles:
- title: Collinearity reproductions
  desc: >
    Published cases where collinearity was diagnosed without applying the
    correct data transformation, reproduced and compared against
    multiCollglm's results.
  contents:
  - reproduction-lee-cancer
  - reproduction-nitrogen
  - reproduction-mines
  - reproduction-bodyfat
  - reproduction-plastic
  - reproduction-template
  # As more articles are added (starting from reproduction-template.Rmd),
  # list them here one per line, e.g.:
  # - reproduction-perez-2019-energy-consumption
