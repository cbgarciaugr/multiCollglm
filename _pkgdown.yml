url: https://cbgarciaugr.github.io/multiCollglm/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "multiCollglm: diagnósticos de colinealidad para GLM"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
  components:
    articles:
      text: Artículos
      menu:
      - text: Reproducciones de colinealidad
      - text: "-------"

reference:
- title: Diagnósticos
  desc: >
    Las tres funciones principales, calculadas sobre la matriz de diseño
    ponderada por IRLS en convergencia y escalada a longitud unitaria por
    columna (sin centrar).
  contents:
  - condition_number
  - bkw_diagnostics
  - rvif_diagnostics
- title: Paquete
  contents:
  - multiCollglm-package

articles:
- title: Reproducciones de colinealidad
  desc: >
    Casos publicados en los que la colinealidad se diagnosticó sin aplicar
    la transformación correcta de los datos, reproducidos y comparados con
    los resultados de multiCollglm.
  contents:
  - reproduccion-plantilla
