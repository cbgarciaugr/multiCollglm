url: https://cbgarciaugr.github.io/multiCollglm/

template:
  bootstrap: 5
  bootswatch: flatly

home:
  title: "multiCollglm: collinearity diagnostics for GLMs"

reference:
- title: Diagnostics
  desc: >
    The three main functions, computed on the design matrix weighted by
    IRLS at convergence and scaled to unit length by column (without
    centering).
  contents:
  - condition_number
  - bkw_diagnostics
  - rvif_diagnostics
- title: ML-collinearity
  desc: >
    Compares the condition number of the original design matrix against
    that of the IRLS-weighted information matrix, following Lesaffre and
    Marx (1993), to tell apart ordinary collinearity among the
    explanatory variables from ML-collinearity.
  contents:
  - ml_collinearity
- title: Example datasets
  desc: >
    Real data used in the reproduction articles (see below).
  contents:
  - Nitrogen
  - Mine
  - LeeCancer
  - Plastic
- title: Package
  contents:
  - multiCollglm-package

articles:
- title: Collinearity reproductions
  desc: >
    Published cases where collinearity was diagnosed without applying the
    correct data transformation, reproduced and compared against
    multiCollglm's results.
  contents:
  - articles/reproduction-lee-cancer
  - articles/reproduction-nitrogen
  - articles/reproduction-mines
  - articles/reproduction-bodyfat
  - articles/reproduction-plastic
  # As more articles are added (starting from reproduction-template.Rmd),
  # list them here one per line, e.g.:
  # - articles/reproduction-perez-2019-energy-consumption
- title: internal
  contents:
  - articles/reproduction-template
